<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rezm.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 380px; background: #fff; color: #1a1a2e; }
    .header { padding: 16px; background: linear-gradient(135deg, #1a1a2e, #2d2b55); color: #fff; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header .subtitle { font-size: 11px; opacity: 0.7; }
    .content { padding: 16px; }
    .status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .status.connected { background: #ecfdf5; color: #065f46; }
    .status.disconnected { background: #fef2f2; color: #991b1b; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .status.connected .dot { background: #10b981; }
    .status.disconnected .dot { background: #ef4444; }
    .btn { width: 100%; padding: 10px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; }
    .btn-primary { background: #4338ca; color: #fff; }
    .btn-primary:hover { background: #3730a3; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #f4f4f5; color: #1a1a2e; margin-top: 8px; }
    .btn-secondary:hover { background: #e4e4e7; }
    .btn-accent { background: linear-gradient(135deg, #7c3aed, #4338ca); color: #fff; margin-top: 8px; }
    .btn-accent:hover { background: linear-gradient(135deg, #6d28d9, #3730a3); }
    .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #fef2f2; color: #991b1b; margin-top: 8px; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-small { width: auto; padding: 6px 10px; font-size: 11px; font-weight: 600; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; color: #1a1a2e; cursor: pointer; }
    .btn-small:hover { background: #f4f4f5; }
    .smart-hint { font-size: 11px; color: #6b7280; text-align: center; margin-top: 4px; margin-bottom: 4px; }
    .result { padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; text-align: center; }
    .result.success { background: #ecfdf5; color: #065f46; }
    .result.error { background: #fef2f2; color: #991b1b; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider { height: 1px; background: #e5e7eb; margin: 12px 0; }

    /* Existing-job banner */
    .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; border: 1px solid; }
    .banner.saved { background: #fefce8; border-color: #fde68a; color: #713f12; }
    .banner.applied { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
    .banner.applied.strong { background: #d1fae5; border-color: #34d399; }
    .banner .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .banner .title { font-weight: 700; font-size: 13px; }
    .banner .meta { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .banner .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.08); }
    .banner.applied .badge { background: #10b981; color: #fff; }
    .banner.saved .badge { background: #f59e0b; color: #fff; }
    .banner .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

    /* Match score badge */
    #match-panel { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 1px solid #c7d2fe; border-radius: 8px; margin-top: 12px; }
    .match-badge { font-size: 22px; font-weight: 800; color: #4338ca; min-width: 56px; text-align: center; }
    .match-badge.high { color: #059669; }
    .match-badge.low { color: #dc2626; }
    .match-label { font-size: 11px; color: #4b5563; }
    .match-label strong { display: block; font-size: 13px; color: #1f2937; }

    /* Filled fields list */
    #filled-fields { margin-top: 12px; }
    #filled-fields h3 { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field-list { max-height: 220px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; }
    .field-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 12px; }
    .field-row:last-child { border-bottom: 0; }
    .field-row .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: #6b7280; font-weight: 600; }
    .field-row .value { font-size: 12px; color: #1f2937; word-break: break-word; grid-column: 1 / -1; }
    .field-row .type { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-weight: 600; text-transform: uppercase; align-self: start; }

    /* PDF preview */
    #pdf-preview { margin-top: 12px; }
    #pdf-preview h3 { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .pdf-frame { width: 100%; height: 240px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; }
    .pdf-frame-fallback { padding: 20px; border: 1px dashed #d4d4d8; border-radius: 8px; text-align: center; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>rezm.ai</h1>
      <div class="subtitle">Smart Apply Extension</div>
    </div>
  </div>

  <div class="content">
    <div id="status-section"></div>
    <div id="job-banner" hidden></div>
    <div id="action-section"></div>

    <div id="match-panel" hidden>
      <div class="match-badge" id="match-badge">--%</div>
      <div class="match-label">
        <strong>Match score</strong>
        <span id="match-detail">Resume vs. job description</span>
      </div>
    </div>

    <div id="filled-fields" hidden>
      <h3>Filled <span id="filled-count">0</span> fields</h3>
      <div class="field-list" id="filled-fields-list"></div>
    </div>

    <div id="pdf-preview" hidden>
      <h3>Resume PDF attached</h3>
      <iframe id="pdf-frame" class="pdf-frame" title="Resume PDF preview"></iframe>
      <div id="pdf-fallback" class="pdf-frame-fallback" hidden>PDF too large to preview inline.</div>
      <button class="btn btn-secondary" id="open-pdf-btn" style="margin-top:8px;">Open full PDF in new tab</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
